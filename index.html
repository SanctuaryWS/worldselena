  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050507;
      color: #ffffff;
      padding: 18px;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #9fb0ff;
      box-shadow: 0 0 18px rgba(159,176,255,.6);
      background: #111;
      flex: 0 0 auto;
    }

    .site-title h1 {
      font-size: 30px;
      line-height: 1;
    }

    .site-title p {
      color: #aaaec4;
      margin-top: 6px;
      font-size: 14px;
    }

    .search-row {
      display: flex;
      margin-bottom: 16px;
    }

    .search-row input {
      flex: 1;
      padding: 15px 18px;
      border-radius: 24px;
      border: none;
      outline: none;
      background: #191b2f;
      color: white;
      font-size: 16px;
    }

    /* Верхнее меню: гибкое, без прокрутки, компактное */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 14px;
      overflow: visible;
      white-space: normal;
      margin-bottom: 6px;
      padding-bottom: 0;
    }

    .tab {
      flex: 0 0 auto;
      background: none;
      border: none;
      color: #85899e;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      padding: 4px 0 6px;
      white-space: nowrap;
    }

    .tab.active {
      color: white;
      border-bottom: 3px solid white;
    }

    .filter-line {
      min-height: 0;
      margin-bottom: 10px;
      color: #aaaec4;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-line:empty {
      display: none;
      margin: 0;
    }

    .active-filter {
      background: linear-gradient(135deg, #4051a8, #2b8f77);
      color: white;
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: bold;
      font-size: 13px;
    }

    .reset-filter {
      background: #2a2d42;
      color: #ffadc9;
      border: 1px solid #4b506f;
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    .history {
      background: #202131;
      border-radius: 18px;
      padding: 16px;
      margin-top: 12px;
      margin-bottom: 18px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .history h2,
    .results-title {
      font-size: 20px;
      font-weight: 600;
      color: #e6e8f5;
      letter-spacing: 0.2px;
    }

    .history button {
      background: none;
      border: none;
      color: #ffadc9;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .history p,
    .counter {
      color: #8f93a8;
      font-size: 13px;
    }

    .results-title {
      margin-bottom: 8px;
    }

    .counter {
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      align-items: stretch;
    }

    .card {
      background: #202131;
      border: 1px solid #313653;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .cover-wrap {
      position: relative;
      aspect-ratio: 2 / 3;
      background: linear-gradient(135deg,#2d335d,#12131d);
      overflow: hidden;
    }

    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .status-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      background: rgba(45,122,86,.92);
      color: white;
      z-index: 2;
    }

    .card-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .book-title {
      font-size: 13px;
      line-height: 1.2;
      min-height: 44px;
      max-height: 44px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    /* Теги гибкие: если тегов нет — место исчезает */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 0;
      height: auto;
      max-height: 54px;
      overflow: hidden;
      margin: 0 0 10px 0;
      align-content: flex-start;
    }

    .tags:empty {
      display: none;
      min-height: 0;
      height: 0;
      max-height: 0;
      margin: 0;
      padding: 0;
    }

    .tag {
      border: none;
      border-radius: 8px;
      background: #4a4d58;
      color: #f2f2f2;
      padding: 5px 9px;
      font-size: 12px;
      cursor: pointer;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tag:hover {
      background: #626672;
    }

    .tag.active-tag {
      background: linear-gradient(135deg, #5869d8, #2baf8c);
      color: white;
      box-shadow: 0 0 10px rgba(88,105,216,.55);
    }

    .links {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin-top: auto;
    }

    .links a {
      text-decoration: none;
      text-align: center;
      color: white;
      border: 1px solid #58618d;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 13px;
      font-weight: bold;
      background: #242846;
    }

    .links a:hover {
      background: #32385f;
    }

    .empty {
      color: #aaaec4;
      padding: 24px;
      background: #202131;
      border-radius: 18px;
      display: none;
    }

    /* Окно фильтров */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      z-index: 50;
      display: none;
      align-items: flex-end;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .category-sheet {
      width: 100%;
      max-width: 900px;
      max-height: 88vh;
      overflow-y: auto;
      margin: 0 auto;
      background: rgba(42, 43, 55, .97);
      border-radius: 26px 26px 0 0;
      padding: 18px 14px 16px;
      box-shadow: 0 -10px 35px rgba(0,0,0,.45);
      animation: sheetUp .22s ease-out;
    }

    @keyframes sheetUp {
      from {
        transform: translateY(100%);
        opacity: .5;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .sheet-title {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .sheet-section-title {
      color: #b9bdcf;
      font-size: 13px;
      margin: 12px 0 8px;
      font-weight: bold;
    }

    .sheet-options {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .sheet-chip {
      border: none;
      border-radius: 999px;
      background: #777b82;
      color: #fff;
      padding: 8px 11px;
      font-size: 12px;
      line-height: 1.1;
      font-weight: bold;
      cursor: pointer;
      max-width: 100%;
    }

    .sheet-chip.selected {
      background: linear-gradient(135deg, #ff3c96, #ff1c7b);
      box-shadow: 0 0 16px rgba(255, 60, 150, .65);
    }

    .sheet-actions {
      position: sticky;
      bottom: -16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
      padding-top: 14px;
      background: linear-gradient(to top, rgba(42,43,55,1), rgba(42,43,55,.95));
    }

    .sheet-actions button {
      border: none;
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    .sheet-reset {
      background: #8b8e93;
    }

    .sheet-confirm {
      background: linear-gradient(135deg, #ff3c96, #ff1c7b);
      box-shadow: 0 0 16px rgba(255, 60, 150, .55);
    }

    @media (max-width: 560px) {
      body {
        padding: 12px;
      }

      header {
        gap: 12px;
        margin-bottom: 20px;
      }

      .logo {
        width: 60px;
        height: 60px;
      }

      .site-title h1 {
        font-size: 25px;
      }

      .search-row {
        margin-bottom: 14px;
      }

      .tabs {
        gap: 5px 11px;
        margin-bottom: 4px;
        padding-bottom: 0;
      }

      .tab {
        font-size: 12px;
        padding: 3px 0 5px;
      }

      .history {
        margin-top: 10px;
        margin-bottom: 16px;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }

      .book-title {
        font-size: 12px;
        min-height: 42px;
        max-height: 42px;
      }

      .tags {
        max-height: 50px;
        margin-bottom: 8px;
      }

      .tag {
        font-size: 11px;
        padding: 5px 7px;
      }

      .links {
        gap: 6px;
      }

      .links a {
        font-size: 12px;
        padding: 7px 5px;
      }

      .status-badge {
        font-size: 10px;
        padding: 5px 7px;
      }

      .category-sheet {
        max-height: 82vh;
        border-radius: 22px 22px 0 0;
      }

      .sheet-chip {
        font-size: 11px;
        padding: 7px 10px;
      }

      .sheet-options {
        gap: 6px;
      }

      .sheet-title {
        font-size: 20px;
      }

      .sheet-actions {
        gap: 10px;
      }
    }
  
    /* Окно аннотации */
    .annotation-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .68);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .annotation-backdrop.open {
      display: flex;
    }

    .annotation-modal {
      width: min(620px, 100%);
      max-height: 82vh;
      overflow-y: auto;
      background: rgba(32, 33, 49, .98);
      border: 1px solid #3c4162;
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(0,0,0,.55);
      padding: 18px;
    }

    .annotation-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .annotation-title {
      font-size: 20px;
      line-height: 1.25;
      color: #ffffff;
    }

    .annotation-close {
      border: none;
      background: #34384f;
      color: #fff;
      border-radius: 999px;
      width: 34px;
      height: 34px;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .annotation-text {
      color: #d9dbea;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .annotation-text b,
    .annotation-text strong {
      font-weight: 700;
      color: #ffffff;
    }

    .annotation-text i,
    .annotation-text em {
      font-style: italic;
    }

    .annotation-text u {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .annotation-actions {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .annotation-read {
      text-decoration: none;
      text-align: center;
      color: white;
      border: 1px solid #58618d;
      border-radius: 12px;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      background: #242846;
    }

    .annotation-read:hover {
      background: #32385f;
    }

    .annotation-btn {
      border: 1px solid #58618d;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 13px;
      font-weight: bold;
      background: #242846;
      color: white;
      cursor: pointer;
      width: 100%;
    }

    .annotation-btn:hover {
      background: #32385f;
    }

    @media (max-width: 560px) {
      .annotation-backdrop {
        align-items: flex-end;
        padding: 0;
      }

      .annotation-modal {
        max-height: 86vh;
        border-radius: 22px 22px 0 0;
        padding: 16px;
      }

      .annotation-title {
        font-size: 18px;
      }

      .annotation-text {
        font-size: 14px;
      }
    }

  </style>

</head>
<body>
  <div class="app">
    <header>
      <img class="logo" src="https://i.ibb.co/d0jjvDWf/logo.jpg" alt="Sanctuary logo">
      <div class="site-title">
        <h1>Sanctuary</h1>
        <p>Каталог книг и серий</p>
      </div>
    </header>

    <div class="search-row">
      <input id="searchInput" type="text" placeholder="Введите название книги" />
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab active" id="homeButton">Главная</button>
      <button class="tab menu-tab" data-menu="genre">Жанры ▼</button>
      <button class="tab menu-tab" data-menu="author">Авторы ▼</button>

  <div class="modal-backdrop" id="filterBackdrop">
    <div class="category-sheet">
      <h2 class="sheet-title" id="sheetTitle">Фильтр</h2>

      <div class="sheet-section-title" id="sheetMainTitle">Выберите пункт</div>

      <div class="sheet-section-title" id="sheetTagsTitle" style="display:none;">Теги-подборки</div>
      <div class="sheet-options" id="sheetTags" style="display:none;"></div>

      <div class="sheet-actions">
        <button class="sheet-reset" id="sheetReset">Сбросить</button>
        <button class="sheet-confirm" id="sheetConfirm">Подтвердить</button>
      </div>
    </div>
  </div>

  <div class="annotation-backdrop" id="annotationBackdrop">
    <div class="annotation-modal">
      <div class="annotation-header">
        <h2 class="annotation-title" id="annotationTitle">Аннотация</h2>
        <button class="annotation-close" id="annotationClose" type="button">×</button>
      </div>
      <div class="annotation-text" id="annotationText"></div>
      <div class="annotation-actions">
        <a class="annotation-read" id="annotationRead" href="#" target="_blank">Читать</a>
      </div>
    </div>
  </div>

  description: "Лучший день в его жизни обернётся для неё сущим кошмаром.\n\nЕщё с колледжа Марко Доусон видел в Белле только друга. В день своей свадьбы он вспоминал о ней лишь из праздного любопытства. Марко не мог понять, почему подружка невесты не явилась на венчание. В конце концов, его молодая жена и Изабелла были соседками по комнате.\n\nПрошло семь лет, и Белла узнает, что Марко недавно развелся и планирует с семьей отдохнуть на элитном курорте Канкуна. Изабелла не желает второй раз упускать свое счастье из рук, поэтому отправляется на курорт, планируя «случайно» столкнуться с Марко и разжечь в его душе искру любви.\n\nПроблема в том, что Белла не учла одного: Финна Доусона — красивого, обаятельного, брата-близнеца Марко, который хочет помирить бывших супругов и ради этого собирается поломать все планы очаровательной мисс Линд.\n\n<b>Примечание:</b> Вдохновением для написания этой романтической истории стали два фильма: «Сабрина» и «Пока ты спал».",

{

  description: "Далия, падчерица жаждущего власти колдуна, обещает освободить пойманного в зеркальную ловушку джинна, если тот спасёт её от неминуемой смерти.\n\nОднако у Ашмаэла свои планы: обмануть, соблазнить и обрести свободу. Беда в том, что он начинает влюбляться в Далию. Сможет ли джинн отвоевать свободу и спасти девушку?\n\n<b>Примечание:</b> «Джинн в зеркале» — это своеобразная история Золушки о юной чародейке и злом, невероятно привлекательном джинне в роли феи-крёстной.",

{

  author: "Джейми Шлоссер",
  cover: "https://i.ibb.co/wZ8FN37G/The-Fae-Kings-Curse-alt.jpg",

  description: "<b><i>Любовь, что сильнее времени и не подвластна проклятию.</i></b>\n\nНам с Киараном было всего по двенадцать, когда я вытащила его из ледяных вод ручья за своим домом. Когда он повернул голову в мою сторону — с этими невидящими, лавандовыми глазами — я сразу поняла: наш возраст, пожалуй, единственное, что нас связывает.\n\nОн говорил с акцентом, у него были заострённые уши, а ещё — он был так красив, что у меня защемило сердце.\n\nОн утверждал, что является принцем фейри, проклятым ведьмами, которые лишили его зрения.\n\nТогда я подумала, что он сошёл с ума от холода. Но оказалось — вовсе нет. И по какой-то странной причине он продолжал возвращаться.\n\nПроблема лишь в том, что один день в моём мире равен целому году в его. Каждый раз, когда я вижу Киарана, он становится старше. Мудрее. И… ещё прекраснее.\n\nПоследние шесть лет я изо всех сил стараюсь не влюбляться в него, ведь условия проклятия просты: если он не дождётся своей истинной пары всеми возможными способами — включая поцелуй, будь он невинным… или не совсем, — он останется слеп навеки.\n\nПоэтому, когда Киаран целует меня и уносит сквозь портал в своё царство, я ставлю перед собой цель — хоть как-то всё исправить.\n\nБыло бы куда проще, если бы он не был так решительно настроен жениться на мне… и если бы кто-то не пытался убить меня на каждом шагу.\n\n<b><i>Между Рассветом и Закатом рождается история, которую невозможно забыть.</i></b>",

  description: "<i>С первым появлением на страницах книг Сими завоевала сердца читателей. На протяжении более двух десятилетий поклонники серии просили Шеррилин Кеньон историю о демоне Ашерона. И теперь они узнают всю правду...</i>\n\nКак видно, никому из нас жизнь легко не даётся. Особенно, демонице. Осиротев в детстве, Сими вынуждена искать свой путь в царстве смертных. Связанная с богом Атлантиды, невольно ставшим причиной смерти её матери, Сими всю свою жизнь пытается разобраться в столь непонятном для неё мире.\n\nОднако в борьбе богов за власть демонам, тёмным охотникам и людям придётся принять чью-либо сторону, и Сими больше не может полагаться на защиту Ашерона. Она должна найти свой собственный путь. Не только ради себя, но и ради своих близких и друзей.\n\nЛишь одно существо знает секрет спасения жизни Ашерона. Но цена непомерно высока: отдать себя на милость существа, известного своей жестокостью. Казалось бы, лёгкий выбор. Спасти Ашерона во что бы то ни стало. Тем не менее, иногда нужно отступить, ведь, спасая Ашерона, Сими может погибнуть.",

  description: "<i>Автор бестселлеров №1 по версии «New York Times» Шеррилин Кеньон открывает совершенно новый мир, не похожий ни на что, виденное ранее…</i>\n\n<b><i>Верни своё королевство...</i></b>\n\nГизела Кровавый Шип обучена убивать. Отданная в юности своим королевством в заложницы, она провела в рабстве почти всю жизнь и стала ассасином при дворе кентавров — там, где выживают лишь сильнейшие.\n\nТеперь у королевы Фессалии для неё осталось всего два задания: защитить Хранителя Клятвы, на теле которого начертан контракт, способный держать врагов в страхе, и устранить врагов короны. В награду Гизела получит свободу.\n\nНо, столкнувшись с первым из так называемых Отщепенцев — Заудином Казиком, — она понимает: враги не таковы, какими кажутся. И убить их оказывается куда сложнее, чем она ожидала.\n\nЗаудин — не просто незаконнорождённый наполовину троль. Он наёмный убийца, посвятивший свою жизнь избавлению Тринадцати Королевств от Хранителей Клятв, особенно от того, на чьём теле высечен контракт королевы кентавров — того самого, которого Гизела поклялась защищать.\n\nДля них обоих доверие — непозволительная роскошь. Но если они не сумеют преодолеть боль, страх и бремя прошлого, если не объединятся против истинного врага, они потеряют не только друг друга… но и весь мир.",

  description: "Нелегко, когда жизнь превращается в анекдот, но Джозетта Лэндри отлично с этим справляется. Хотя судьба продолжает подкидывать один неприятный сюрприз за другим, Джо не намерена засовывать голову в духовку. Все отлично. То, что нас не убивает, становится причиной психических расстройств.\n\nРазуверившись в собственной удаче, Джозетта устраивается на работу фотографом и видеооператором к местным охотникам на приведений, которые пытаются выбить себе место на телевидении.\n\nО да, с головой у них явно не все в порядке. Лично сама Джозетта верит в единственное волшебство — чудо, позволяющее её ржавой колымаге держаться на ходу.\n\nКогда же незадачливые охотники случайно выпускают в мир настоящее зло, им придётся звать на помощь подкрепление.\n\nС первой секунды встречи с Кэдиганом Джозетта поняла, что он не так прост. И дело не в том, что она не может даже произнести его фамилию: Мабоддамун. Таинственный красавец, наделённый убийственным сарказмом, кажется намного старше, чем выглядит.\n\nНесколько веков назад Кэдиган продал душу ради мести предателю, наславшему на него проклятие. Однако наперекор собственной сущности Кэдиган творит добро и ненавидит весь мир. Он живёт, одолеваемый единственным желанием — выбраться из адской ловушки. К сожалению, вечные страдания — единственный удел проклятых. Хотя что-то в Джозетте манит его, затрагивая душу настолько, что это сбивает с толку. И бороться с притяжением он не в силах, хотя Кэдиган знает, что в прошлый раз подобные чувства лишили его души.\n\nКэдиган понимает, что должен держаться от Джозетты подальше, но вырвавшееся на свободу зло готово низвергнуть мир в пучину ада ради её души.\n\nВпрочем, он ни за что на свете не позволит им заполучить её. Ведь без неё жизнь в аду покажется раем. Вот только как Кэдигану защищать Джозетту, когда именно он представляет для неё самую серьёзную опасность?",

    function normalizeText(value) {
      return String(value || "").trim().toLowerCase().replaceAll("ё", "е");
    }

    function escapeHTML(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDescription(value) {
      let text = escapeHTML(value || "Аннотация пока не добавлена.");

      const allowedTags = ["b", "strong", "i", "em", "u"];
      allowedTags.forEach(tag => {
        text = text.replaceAll(`&lt;${tag}&gt;`, `<${tag}>`);
        text = text.replaceAll(`&lt;/${tag}&gt;`, `</${tag}>`);
      });

      text = text
        .replaceAll("&lt;br&gt;", "<br>")
        .replaceAll("&lt;br/&gt;", "<br>")
        .replaceAll("&lt;br /&gt;", "<br>");

      return text;
    }

    function getAuthor(book) {
      return book.author || String(book.title || "").split(" / ")[0].trim() || "Без автора";

    function getBookGenres(book) {
      if (!Array.isArray(book.genres)) return [];

      return book.genres.map(genre => {
        if (normalizeText(genre) === "городское") return "Городское фэнтези";
        return genre;
      });
    }

    function getBookSeriesItems(book) {
      const items = [];
      if (book.series) items.push(book.series);
      if (book.subseries) items.push(book.subseries);
      if (Array.isArray(book.arcs)) items.push(...book.arcs);
      if (book.standalone) items.push("Одиночные романы");
      return items.filter(Boolean);
    }

    function getOptionsByMenuType(type) {
      if (type === "genre") return FIXED_CATEGORIES;
      if (type === "author") return getAllAuthors().map(author => ({ label: author, value: author }));
      if (type === "series") return getAllSeries().map(series => ({ label: series, value: series }));

      if (type === "standalone") {
        return [
          { label: "Современные романы", value: "Современные романы" },
          { label: "Исторические романы", value: "Исторические романы" },
          { label: "Городское фэнтези", value: "Городское фэнтези" },
          { label: "Детектив", value: "Детектив" },
          { label: "Драма", value: "Драма" },
          { label: "Фэнтези", value: "Фэнтези" },
          { label: "Фантастика", value: "Фантастика" },
          { label: "Мистика", value: "Мистика" },
          { label: "Сказки", value: "Сказки" },
          { label: "Романтика", value: "Романтика" },
          { label: "Эротика", value: "Эротика" },
          { label: "Рассказы", value: "Рассказы" }
        ];
      }

      if (type === "tag") return getAllTags().map(tag => ({ label: tag, value: tag }));
      return [];
    }

    function renderSheetOptions() {
      const options = getOptionsByMenuType(tempMenuType);
      sheetCategories.innerHTML = "";

      options.forEach(option => {
        const button = document.createElement("button");
        button.className = normalizeText(tempValue) === normalizeText(option.value) ? "sheet-chip selected" : "sheet-chip";
        button.textContent = option.label;
        button.addEventListener("click", () => {
          tempValue = tempValue === option.value ? null : option.value;
          renderSheetOptions();
        });
        sheetCategories.appendChild(button);
      });
    }

    function applyFilter(type, value) {
      currentGenre = null;
      currentAuthor = null;
      currentSeries = null;
      currentStandalone = null;
      currentTag = null;

      if (type === "genre") currentGenre = value;
      if (type === "author") currentAuthor = value;
      if (type === "series") currentSeries = value;
      if (type === "standalone") currentStandalone = value;
      if (type === "tag") currentTag = value;

      updateTopMenuActive();
      renderBooks();
    }

    function renderFilterLine() {
      const parts = [];

      if (currentGenre) parts.push(`<span class="active-filter">Жанр: ${escapeHTML(currentGenre)}</span>`);
      if (currentAuthor) parts.push(`<span class="active-filter">Автор: ${escapeHTML(currentAuthor)}</span>`);
      if (currentSeries) parts.push(`<span class="active-filter">Серия: ${escapeHTML(currentSeries)}</span>`);
      if (currentStandalone) parts.push(`<span class="active-filter">Однотомники: ${escapeHTML(currentStandalone)}</span>`);
      if (currentTag) parts.push(`<span class="active-filter">Подборка: ${escapeHTML(currentTag)}</span>`);

      if (!parts.length) {
        filterLine.innerHTML = "";
        return;
      }

      filterLine.innerHTML = `
        <span>Выбрано:</span>
        ${parts.join("")}
        <button class="reset-filter" onclick="clearAllFilters()">Сбросить</button>
      `;
    }

    function renderBooks() {
      const query = searchInput.value.toLowerCase().trim();

      const filtered = books.filter(book => {
        const genres = getBookGenres(book);
        const author = getAuthor(book);
        const seriesItems = getBookSeriesItems(book);

        const matchesSearch =
          book.title.toLowerCase().includes(query) ||
          author.toLowerCase().includes(query) ||
          seriesItems.some(item => item.toLowerCase().includes(query)) ||
          (book.tags || []).some(tag => tag.toLowerCase().includes(query)) ||
          genres.some(genre => genre.toLowerCase().includes(query));

        const matchesGenre =
          !currentGenre ||
          genres.some(genre => normalizeText(genre) === normalizeText(currentGenre)) ||
          (
            normalizeText(currentGenre) === "рассказы" &&
            (book.tags || []).some(tag => normalizeText(tag) === "рассказы")
          ) ||
          (
            normalizeText(currentGenre) === "эротика" &&
            (book.tags || []).some(tag => normalizeText(tag) === "эротика")
          );
        const matchesAuthor = !currentAuthor || normalizeText(author) === normalizeText(currentAuthor);
        const matchesSeries = !currentSeries || seriesItems.some(item => normalizeText(item) === normalizeText(currentSeries));
        const standaloneGenres = genres.map(g => normalizeText(g));
        const standaloneTags = (book.tags || []).map(t => normalizeText(t));

        const matchesStandalone =
          !currentStandalone ||
          (
            book.standalone &&
            (
              (normalizeText(currentStandalone) === "фэнтези" &&
                standaloneGenres.includes("фэнтези")) ||

              (normalizeText(currentStandalone) === "фантастика" &&
                standaloneGenres.includes("фантастика")) ||

              (normalizeText(currentStandalone) === "современные романы" &&
                standaloneGenres.includes("современный роман")) ||

              (normalizeText(currentStandalone) === "исторические романы" &&
                standaloneGenres.includes("исторический роман")) ||

              (
                (normalizeText(currentStandalone) === "городское фэнтези" ||
                 normalizeText(currentStandalone) === "городское") &&
                (
                  standaloneGenres.includes("городское фэнтези") ||
                  standaloneGenres.includes("городское")
                )
              ) ||

              (normalizeText(currentStandalone) === "мистика" &&
                standaloneGenres.includes("мистика")) ||

              (normalizeText(currentStandalone) === "детектив" &&
                standaloneGenres.includes("детектив")) ||

              (normalizeText(currentStandalone) === "драма" &&
                standaloneGenres.includes("драма")) ||

              (
                normalizeText(currentStandalone) === "сказки" &&
                standaloneGenres.includes("сказка")
              ) ||

              (
                normalizeText(currentStandalone) === "романтика" &&
                standaloneGenres.includes("романтика")
              ) ||

              (
                normalizeText(currentStandalone) === "эротика" &&
                (
                  standaloneGenres.includes("эротика") ||
                  standaloneTags.includes("эротика")
                )
              ) ||

              (
                normalizeText(currentStandalone) === "рассказы" &&
                (
                  standaloneGenres.includes("рассказы") ||
                  standaloneTags.includes("рассказы")
                )
              )
            )
          );

        const matchesTag = !currentTag || (book.tags || []).some(tag => normalizeText(tag) === normalizeText(currentTag));

        return matchesSearch && matchesGenre && matchesAuthor && matchesSeries && matchesStandalone && matchesTag;
      });

      bookGrid.innerHTML = "";
      counter.textContent = `Показано ${filtered.length} из ${books.length} • Всего в каталоге ${books.length}`;
      emptyMessage.style.display = filtered.length ? "none" : "block";
      renderFilterLine();

      filtered.forEach(book => {
        const card = document.createElement("article");
        card.className = "card";

        const tagsHTML = (book.tags || []).map(tag => `
          <button class="tag ${currentTag === tag ? "active-tag" : ""}" data-tag="${escapeHTML(tag)}">${escapeHTML(tag)}</button>
        `).join("");

        card.innerHTML = `
          <div class="cover-wrap">
            <span class="status-badge">${escapeHTML(book.status)}</span>
            <img src="${escapeHTML(book.cover)}" alt="${escapeHTML(book.title)}" />
          </div>
          <div class="card-content">
            <h3 class="book-title">${escapeHTML(book.title)}</h3>
            <div class="tags">${tagsHTML}</div>
            <div class="links">
              <button class="annotation-btn" type="button">Аннотация</button>
              <a href="${escapeHTML(book.read)}" target="_blank">Читать</a>
            </div>
          </div>
        `;

        card.querySelectorAll(".tag").forEach(button => {
          button.addEventListener("click", () => {
            applyFilter("tag", button.dataset.tag);
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
        });

        card.querySelector(".annotation-btn").addEventListener("click", () => openAnnotation(book));

        card.querySelector(".links a:last-child").addEventListener("click", () => saveToHistory(book.title));

        bookGrid.appendChild(card);
      });
    }

    homeButton.addEventListener("click", clearAllFilters);

    openMenuButtons.forEach(button => {
      button.addEventListener("click", () => openFilterSheet(button.dataset.menu));
    });

    searchInput.addEventListener("input", renderBooks);

    document.getElementById("clearHistory").addEventListener("click", () => {
      localStorage.removeItem("bookHistory");
      renderHistory();
    });

    filterBackdrop.addEventListener("click", (event) => {
      if (event.target === filterBackdrop) closeFilterSheet();
    });

    annotationBackdrop.addEventListener("click", (event) => {
      if (event.target === annotationBackdrop) closeAnnotation();
    });

    annotationClose.addEventListener("click", closeAnnotation);

    sheetResetBtn.addEventListener("click", () => {
      tempValue = null;
      renderSheetOptions();
    });

    sheetConfirmBtn.addEventListener("click", () => {
      applyFilter(tempMenuType, tempValue);
      closeFilterSheet();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    updateTopMenuActive();
    renderHistory();
    renderBooks();

  </script>
</body>
</html>
